<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitor Esportivo Web Serial</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">Web Serial -> Browser</p>
          <h1>Monitor Esportivo</h1>
        </div>
        <div class="status" id="status">
          <span class="status-dot"></span>
          <span>Carregando</span>
        </div>
      </section>

      <section class="readings" aria-label="Leituras dos sensores">
        <article class="reading-card pulse">
          <span>Batimento</span>
          <strong><output id="hr">--</output><small>bpm</small></strong>
        </article>
        <article class="reading-card axes">
          <span>Aceleração x/y/z</span>
          <strong><output id="accel">--</output><small>g</small></strong>
        </article>
        <article class="reading-card motion">
          <span>Throughput</span>
          <strong><output id="throughput">--</output><small>amostras/s</small></strong>
        </article>
      </section>

      <section class="dashboard-grid">
        <div class="panel operation-panel">
          <div class="panel-heading">
            <h2>Operação</h2>
            <span>Contrato CSV: seq,send_ms,hr,ax,ay,az</span>
          </div>

          <div class="control-grid">
            <label>
              <span>Intervalo</span>
              <input type="number" id="intervalMs" value="100" min="10" step="10" />
            </label>
            <label>
              <span>Baud Arduino</span>
              <input type="number" id="baud" value="115200" step="300" />
            </label>
          </div>

          <div class="actions" aria-label="Controles de conexão e simulação">
            <button type="button" id="connect">Conectar serial</button>
            <button type="button" class="secondary" id="disconnect">Fechar serial</button>
            <button type="button" id="simStart">Iniciar simulação</button>
            <button type="button" class="danger" id="simStop">Parar simulação</button>
          </div>

          <div class="sample-block">
            <span>Última amostra</span>
            <output id="lastLine">--</output>
          </div>

          <div class="log-panel">
            <div class="panel-heading compact">
              <h2>Log</h2>
            </div>
            <div id="log" role="log" aria-live="polite"></div>
          </div>
        </div>

        <aside class="panel details-panel">
          <div class="panel-heading">
            <h2>Sistema</h2>
          </div>
          <dl class="metrics-list">
            <div>
              <dt>Fonte</dt>
              <dd id="source">--</dd>
            </div>
            <div>
              <dt>Mensagens</dt>
              <dd id="totalMessages">0</dd>
            </div>
            <div>
              <dt>Invalidas</dt>
              <dd id="invalidMessages">0</dd>
            </div>
            <div>
              <dt>Perdidas</dt>
              <dd id="lostMessages">0</dd>
            </div>
            <div>
              <dt>Por segundo</dt>
              <dd id="messagesPerSecond">0</dd>
            </div>
            <div>
              <dt>Latencia</dt>
              <dd id="latency">--</dd>
            </div>
          </dl>
        </aside>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
