# Configuracao minima do Mosquitto para a A4 do TCC.
# Espelha o documentado em arquitetura-mqtt/broker.md.
#
# Sem autenticacao: o TCC trata seguranca como analise qualitativa, e o
# broker so eh exposto na rede local do experimento. Em producao,
# habilitar `password_file` + TLS.

persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
