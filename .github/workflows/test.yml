# Workflow de CI que executa todos os testes Node + Python a cada push
# e pull request, em Ubuntu e Windows. O job de build TS valida que
# backend e serverless compilam sem erros de tipo. O badge gerado por
# este workflow eh referenciado no README na secao "Status".
#
# Por que dois sistemas operacionais: a campanha oficial roda em
# Windows (vide scripts/lib/keep-awake.mjs com SetThreadExecutionState),
# mas o codigo precisa rodar em Linux tambem para que outros
# pesquisadores reproduzam sem barreira de plataforma.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela runs em duplicidade quando um novo commit chega na mesma branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (raiz + subprojetos)
        run: |
          npm ci
          npm run install:all

      - name: Build backend (TypeScript)
        run: npm run build:backend

      - name: Build serverless (TypeScript, --noEmit)
        run: npm run build:serverless

      - name: Run Node test suites
        # Os testes seguem o padrao test_*.test.mjs ou rollover-*.test.mjs.
        # node --test pega todos com um unico comando.
        run: node --test scripts/tests/*.test.mjs scripts/tests/test_collection_parity.mjs

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        # Os modulos cientificos usados pelo pipeline pos-coleta
        # (consolidate_results, plot_results, gera_tabelas_artigo)
        # estao declarados em requirements.txt na raiz -- mesmo arquivo
        # que o `cache: pip` acima usa como chave de cache.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests (unittest auto-discovery)
        run: python -m pytest scripts/tests/test_lib_py.py scripts/tests/test_pos_processing_parity.py -v

  smoke-orchestrator:
    name: Smoke orchestrator (simulator-http, sem hardware)
    runs-on: ubuntu-latest
    needs: [node-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run install:all

      - name: Build backend
        run: npm run build:backend

      # Roda a versao mais curta da campanha (1 rep x 15s x intervalo 100ms)
      # contra o simulator-http -- garante que orquestrador + runners + 
      # writers + simulador continuam encaixando sem precisar de ESP32.
      - name: Smoke campaign (A1+A2 via simulator)
        run: |
          node scripts/run-experiments.mjs \
            --source simulator-http \
            --scenarios a1,a2 \
            --reps 1 --duration 15 --intervals 100 \
            --results-dir resultados/ci-smoke \
            --skip-analysis \
            --no-keep-awake

      - name: Assert smoke output exists
        run: |
          test -f resultados/ci-smoke/*_metrics.csv && \
          test -f resultados/ci-smoke/*_experiment-summary.json && \
          echo "Smoke OK"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-${{ github.run_id }}
          path: resultados/ci-smoke/
          retention-days: 7
